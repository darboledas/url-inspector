name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Mantener forzado el entorno UTF-8 también en runners Windows.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_v6.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_v6.txt pypdf

      - name: Compile
        run: python -m py_compile url_inspector_6.0.py benchmark_url_inspector.py batch_url_inspector.py informes_une_197001.py url_inspector_informes_une.py menu_url_inspector.py

      - name: Offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: CLI smoke tests
        run: |
          python url_inspector_6.0.py --help
          python benchmark_url_inspector.py --help
          python batch_url_inspector.py --help
          python informes_une_197001.py --help
          python menu_url_inspector.py --help

      - name: Validate Linux launcher syntax
        if: runner.os == 'Linux'
        run: |
          bash -n ejecutar_url_inspector_INFORMES_UNE.sh
          bash ejecutar_url_inspector_INFORMES_UNE.sh --help

      - name: Windows launcher help (without installing packages)
        if: runner.os == 'Windows'
        shell: cmd
        run: call ejecutar_url_inspector_INFORMES_UNE.bat --help
