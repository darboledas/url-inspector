name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_v6.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_v6.txt

      - name: Compile
        run: python -m py_compile url_inspector_6.0.py benchmark_url_inspector.py batch_url_inspector.py

      - name: Offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: CLI smoke tests
        run: |
          python url_inspector_6.0.py --help
          python benchmark_url_inspector.py --help
          python batch_url_inspector.py --help
